plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bipiroo.marinefleettracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bipiroo.marinefleettracker'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        buildConfigField "String", "AIS_BASE_URL", "\"DEMO\""
        buildConfigField "String", "AIS_API_KEY", "\"\""
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'androidx.work:work-runtime:2.9.1'
}
